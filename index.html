<!-- ファイル名: index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025年 昭島国際法務PFI忘年会</title>
    
    <!-- Google Fonts: 高級感のあるセリフ体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景アニメーション用キャンバス -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- ビネット効果（画面の隅を暗くして視線を中央に集める） -->
    <div class="vignette"></div>

    <!-- メインコンテンツ -->
    <main class="main-content">
        <!-- 抽象的な光のツリー（呼吸するような演出を追加） -->
        <div class="abstract-tree">
            <div class="tree-line"></div>
            <div class="tree-line"></div>
            <div class="tree-line"></div>
            <div class="tree-star">✦</div>
        </div>

        <!-- タイトルセクション -->
        <div class="text-container">
            <p class="year">2025</p>
            <h2 class="company-name">昭島国際法務PFI</h2>
            <h1 class="event-title">忘年会</h1>
        </div>
    </main>

    <!-- JavaScriptファイルの読み込み -->
    <script src="script.js"></script>
</body>
</html>
